apiVersion: v1
kind: Namespace
metadata:
  name: agent-vega
  labels:
    app.kubernetes.io/name: vega
    app.kubernetes.io/managed-by: link-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vega-runtime
  namespace: agent-vega
data:
  OUTFITTER_CHANNELS: jmap
  LINK_MAIL_PROCESSED: Processed
---
apiVersion: link.aioutfitter.com/v1alpha1
kind: Organization
metadata:
  name: ncrmro
spec:
  displayName: ncrmro
  agentCatalogs:
    - name: ks-config
      github: ncrmro/ks-config
      revision: __KS_CONFIG_REVISION__
      path: .agents
---
apiVersion: link.aioutfitter.com/v1alpha1
kind: Agent
metadata:
  name: vega
spec:
  memberships:
    - organization: ncrmro
  profile:
    agent: vega
    harness: pi
  credentials:
    - secret: vega-email
      as: env
    - configMap: vega-runtime
      as: env
    # Created only after local Pi/OpenAI auth is copied directly into the PVC.
    - configMap: vega-pi-ready
      as: env
  setup:
    - name: mail-bootstrap
      script: |
        set -eu
        until xin messages search "in:inbox" --max 1 >/dev/null 2>&1; do
          echo "mail-bootstrap: waiting for Vega JMAP connectivity" >&2
          sleep 2
        done
        until xin labels create "$LINK_MAIL_PROCESSED" >/dev/null 2>&1 || \
          xin messages search "in:$LINK_MAIL_PROCESSED" --max 1 >/dev/null 2>&1; do
          echo "mail-bootstrap: waiting to provision $LINK_MAIL_PROCESSED" >&2
          sleep 2
        done
  workspace:
    resourceQuota:
      hard:
        requests.cpu: "2"
        requests.memory: 4Gi
        limits.cpu: "4"
        limits.memory: 8Gi
        requests.storage: 40Gi
        persistentvolumeclaims: "4"
        count/pods: "10"
        count/jobs.batch: "20"
        count/services: "5"
        count/configmaps: "20"
        count/secrets: "10"
    limitRange:
      container:
        defaultRequest:
          cpu: 100m
          memory: 256Mi
        default:
          cpu: "1"
          memory: 2Gi
    volume:
      size: 10Gi
      storageClassName: ocean-nvme
